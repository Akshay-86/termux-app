name: Build and Publish Release APKs

on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'site/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package_variant: [ apt-android-7 ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Set up Keystore
        id: setup_keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding release keystore from secrets..."
            mkdir -p /tmp/keystore
            echo "$KEYSTORE_BASE64" | base64 --decode > /tmp/keystore/release.jks
            echo "KEYSTORE_FILE=/tmp/keystore/release.jks" >> $GITHUB_ENV
          else
            echo "No KEYSTORE_BASE64 secret provided; build will use fallback signature."
          fi

      - name: Build Release APKs
        shell: bash
        env:
          TERMUX_PACKAGE_VARIANT: ${{ matrix.package_variant }}
          TERMUX_SPLIT_APKS_FOR_RELEASE_BUILDS: "1"
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew downloadBootstraps assembleRelease

      - name: Prepare Release Artifacts
        id: prepare_artifacts
        shell: bash
        run: |
          APK_DIR="./app/build/outputs/apk/release"
          mkdir -p ./release-artifacts
          
          # Copy APKs to release folder
          cp $APK_DIR/*.apk ./release-artifacts/
          
          # Generate SHA256 sums
          cd ./release-artifacts
          sha256sum *.apk > sha256sums.txt
          cat sha256sums.txt
          cd ..

      - name: Publish / Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Termux (Secondary User Support) - Latest Release"
          body: |
            ## Termux with Secondary Android User Profile Support
            
            Automated release built from commit `${{ github.sha }}`.
            
            ### Included Changes:
            - **Secondary User / Work Profile / Dual App Support**: Dynamically virtualization using PRoot.
            - **Automatic PRoot Integration**: Injects PRoot directly into official upstream bootstrap.
            
            ### SHA256 Checksums:
            Check `sha256sums.txt` attached below.
          draft: false
          prerelease: false
          files: |
            ./release-artifacts/*.apk
            ./release-artifacts/sha256sums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
